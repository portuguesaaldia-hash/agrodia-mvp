<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AGRODIA — El pulso productivo de Venezuela</title>
  <style>
    :root {
      --verde-oscuro: #14361d;
      --verde-campo: #245c32;
      --verde-claro: #e9f3ec;
      --dorado-agro: #c88a1e;
      --fondo: #f7f8f6;
      --blanco: #ffffff;
      --texto: #1e241f;
      --muted: #5b665e;
      --borde: #dce3de;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--fondo);
      color: var(--texto);
      line-height: 1.5;
    }

    header {
      background: linear-gradient(135deg, var(--verde-oscuro), var(--verde-campo));
      color: var(--blanco);
      padding: 1.5rem 1.25rem;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 0.5rem;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .brand {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .brand span { color: #f5be58; }

    .badge {
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      font-size: 0.85rem;
    }

    .hero h1 {
      font-size: clamp(1.4rem, 3vw, 2.1rem);
      margin-bottom: 0.5rem;
    }

    .hero p {
      color: #e4eee7;
      max-width: 720px;
      font-size: 0.98rem;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin: 1.25rem 0;
    }

    .tab-btn {
      background: var(--blanco);
      border: 1px solid var(--borde);
      color: var(--texto);
      padding: 0.6rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .tab-btn.active {
      background: var(--verde-campo);
      color: var(--blanco);
      border-color: var(--verde-campo);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .card {
      background: var(--blanco);
      border: 1px solid var(--borde);
      border-radius: 12px;
      padding: 1.1rem;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
    }

    .tag {
      display: inline-block;
      background: var(--verde-claro);
      color: var(--verde-campo);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
      margin-bottom: 0.6rem;
    }

    .card h3 {
      font-size: 1.08rem;
      margin-bottom: 0.4rem;
    }

    .card p {
      color: var(--muted);
      font-size: 0.92rem;
      margin-bottom: 0.75rem;
    }

    .meta {
      font-size: 0.85rem;
      color: var(--texto);
      border-top: 1px solid var(--borde);
      padding-top: 0.65rem;
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-bottom: 1rem;
    }

    input, select {
      padding: 0.6rem 0.8rem;
      border: 1px solid var(--borde);
      border-radius: 8px;
      background: var(--blanco);
      font-size: 0.92rem;
      min-width: 200px;
    }

    footer {
      text-align: center;
      padding: 1.5rem 1rem 2.5rem;
      color: var(--muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <div class="topbar">
        <div class="brand">AGRO<span>DIA</span></div>
        <div class="badge">Eje Acarigua - Araure · Portuguesa</div>
      </div>
      <div class="hero">
        <h1>El pulso productivo de Venezuela</h1>
        <p>
          Plataforma de asistencia técnica agrícola, bolsa de fletes de retorno,
          repuestos e insumos y servicios técnicos verificados.
        </p>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="tabs" id="moduleTabs">
      <button class="tab-btn active" data-mod="todos">Todos los módulos</button>
      <button class="tab-btn" data-mod="mecanica">1. Taller al Instante</button>
      <button class="tab-btn" data-mod="fletes">2. Bolsa y Fletes</button>
      <button class="tab-btn" data-mod="insumos">3. Agrotiendas y Repuestos</button>
      <button class="tab-btn" data-mod="servicios">4. Servicios Generales</button>
    </div>

    <div class="controls">
      <input type="text" id="searchInput" placeholder="Buscar por servicio, zona, carga o repuesto..." />
      <select id="zoneSelect">
        <option value="">Todas las zonas</option>
        <option value="Acarigua">Acarigua</option>
        <option value="Araure">Araure</option>
        <option value="Turén">Turén</option>
        <option value="Guanare">Guanare</option>
      </select>
    </div>

    <section class="grid" id="cardsContainer"></section>
  </main>

  <footer>
    Inversiones Medios Digitales al Día, C.A. · AGRODIA MVP
  </footer>

  <script>
    // Datos iniciales de ejemplo para probar la interfaz (reemplazar luego por base de datos o API)
    const registros = [
      {
        modulo: "mecanica",
        etiqueta: "Taller al Instante",
        titulo: "Mecánica Diésel y Sistemas Hidráulicos",
        descripcion: "Diagnóstico en finca para tractores, cosechadoras y bombas de riego con reporte fotográfico.",
        zona: "Acarigua",
        estado: "Disponible"
      },
      {
        modulo: "fletes",
        etiqueta: "Bolsa y Fletes",
        titulo: "Camión Plataforma — Retorno Disponible",
        descripcion: "Capacidad para traslado de maíz, arroz o insumos agrícolas con tarifa referencial por ruta.",
        zona: "Turén",
        estado: "Ruta activa"
      },
      {
        modulo: "insumos",
        etiqueta: "Agrotiendas y Repuestos",
        titulo: "Filtros, Correas, Rodamientos y Lubricantes",
        descripcion: "Consulta de disponibilidad en vitrina comercial y combos de mantenimiento preventivo.",
        zona: "Araure",
        estado: "Stock verificado"
      },
      {
        modulo: "servicios",
        etiqueta: "Servicios Generales",
        titulo: "Electricidad Industrial, Refrigeración y Soldadura",
        descripcion: "Atención técnica verificada para unidades de producción, galpones y hogares.",
        zona: "Guanare",
        estado: "Verificado"
      }
    ];

    let moduloActivo = "todos";
    const cardsContainer = document.getElementById("cardsContainer");
    const searchInput = document.getElementById("searchInput");
    const zoneSelect = document.getElementById("zoneSelect");

    function renderCards() {
      const texto = searchInput.value.trim().toLowerCase();
      const zona = zoneSelect.value;

      const filtrados = registros.filter((item) => {
        const coincideModulo = moduloActivo === "todos" || item.modulo === moduloActivo;
        const coincideZona = !zona || item.zona === zona;
        const coincideTexto =
          !texto ||
          item.titulo.toLowerCase().includes(texto) ||
          item.descripcion.toLowerCase().includes(texto) ||
          item.zona.toLowerCase().includes(texto);
        return coincideModulo && coincideZona && coincideTexto;
      });

      if (!filtrados.length) {
        cardsContainer.innerHTML = `<div class="card"><p>No hay resultados para ese filtro.</p></div>`;
        return;
      }

      cardsContainer.innerHTML = filtrados
        .map(
          (item) => `
          <article class="card">
            <span class="tag">${item.etiqueta}</span>
            <h3>${item.titulo}</h3>
            <p>${item.descripcion}</p>
            <div class="meta">
              <span>📍 ${item.zona}</span>
              <strong>${item.estado}</strong>
            </div>
          </article>
        `
        )
        .join("");
    }

    document.querySelectorAll(".tab-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        moduloActivo = btn.dataset.mod;
        renderCards();
      });
    });

    searchInput.addEventListener("input", renderCards);
    zoneSelect.addEventListener("change", renderCards);

    renderCards();
  </script>
</body>
</html>
